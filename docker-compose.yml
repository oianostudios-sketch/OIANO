version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: oiano_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oiano_studioos
    ports:
      - "5432:5432"
    volumes:
      - oiano_pgdata:/var/lib/postgresql/data

  # Uncomment when ready for Redis-backed notification queue
  # redis:
  #   image: redis:7-alpine
  #   container_name: oiano_redis
  #   ports:
  #     - "6379:6379"

volumes:
  oiano_pgdata:
