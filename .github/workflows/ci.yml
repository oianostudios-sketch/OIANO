name: CI

# SCALE_READINESS_ROADMAP.md Tier 0.4 — until this existed, every deploy was
# unverified: no typecheck, no test run, no build check happened automatically.
#
# Two jobs, deliberately split by what they need. `verify` runs without a
# database: the API's unit suites and the web suite (vitest on jsdom) touch
# neither Prisma nor the network, and typecheck and build never execute
# application code. `integration` gets a real Postgres service, applies every
# migration, and additionally boots the compiled server to prove the artifact
# render.yaml launches actually starts.
#
# node-version is pinned rather than left to the runner default: jsdom's undici
# dependency calls webidl.util.markAsUncloneable, which does not exist in
# Node 20, so the entire web suite failed to load there. package.json's engines
# field carries the floor (>=22); this pin is the version actually tested.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # prisma validate resolves env("DATABASE_URL") in the datasource block, so
      # the variable must exist even though nothing here connects to a database.
      # Deliberately credential-free and unreachable — check-repository-secrets
      # rejects any postgres URL carrying a user:password pair.
      DATABASE_URL: postgresql://127.0.0.1:5432/validate_only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Scan tracked files for secrets
        run: npm run security:secrets

      - name: Validate Prisma schema
        run: npx prisma validate

      # Needed before typecheck/build/test — apps/api imports @prisma/client's
      # generated types, and prisma generate only reads schema.prisma, it
      # never touches a real database.
      - name: Generate Prisma client
        run: npx prisma generate

      # @oiano/shared resolves through its "main": "dist/index.js", and dist/ is
      # gitignored with no prepare script, so npm ci never produces it. Typecheck,
      # tests and build all import it — this must come first.
      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Typecheck API
        run: npm run typecheck --workspace=apps/api

      - name: Typecheck web
        run: npm run typecheck --workspace=apps/web

      # Root `test` runs the API security and intelligence suites plus the web
      # suite (vitest, jsdom) — see the root package.json script.
      #
      # On failure the tail of the output is re-emitted as an ::error::
      # annotation. Run logs need repo-admin auth to fetch, but annotations are
      # readable from the public API, so a failure here can be diagnosed without
      # privileged access instead of guessed at.
      - name: API and web tests
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ "$status" -ne 0 ]; then
            printf '::error::%s\n' "$(tail -c 4000 test-output.txt | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
          fi
          exit "$status"

      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oiano
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: oiano_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oiano -d oiano_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INTEGRATION_DATABASE_URL: postgresql://oiano:integration-only@localhost:5432/oiano_test
      JWT_SECRET: integration-only-jwt-secret-change-me
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      FRONTEND_URL: http://localhost:5173
      STRIPE_ENABLED: 'false'
      OIANO_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # The integration suite boots the real Express app, whose routes import
      # @oiano/shared — see the note in the verify job above.
      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Database-backed platform integration tests
        run: npm run test:integration --workspace=apps/api

      # The suite above imports the app in-process; it never proves the artifact
      # Render actually launches exists or starts. render.yaml's startCommand is
      # `node dist/index.js`, so build it and boot it against the real Postgres
      # service exactly as production does. NODE_ENV=test only stops dotenv
      # overriding these values (app.ts:47) — there is no .env on a runner.
      - name: Boot the compiled API and check /health
        env:
          DATABASE_URL: postgresql://oiano:integration-only@localhost:5432/oiano_test
          JWT_SECRET: integration-only-jwt-secret-change-me
          MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          FRONTEND_URL: http://localhost:5173
          STRIPE_ENABLED: 'false'
          OIANO_AI_ENABLED: 'false'
          NODE_ENV: test
          PORT: '4010'
        run: |
          npm run build --workspace=apps/api
          test -f apps/api/dist/index.js || { echo 'build produced no entrypoint for startCommand'; exit 1; }
          node apps/api/dist/index.js &
          API_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4010/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4010/health | tee /dev/stderr | grep -q '"database":"connected"'
          kill "$API_PID"
